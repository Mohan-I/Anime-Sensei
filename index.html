<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Sensei</title>
    <!--
      Content-Security-Policy
      ─────────────────────────────────────────────────────────────────────────
      connect-src : Tenrai anime API + Supabase data/auth endpoints + full
                    Firebase suite (Auth, Firestore, Analytics config endpoint)
                    + Google APIs.
      script-src  : Google Tag Manager (Analytics) + apis.google.com (Auth popup).
      style-src   : fonts.cdnfonts.com (General Sans) + fonts.googleapis.com.
      font-src    : both CDN font hosts.
      img-src     : MAL cover art, YouTube thumbnails, Google profile photos,
                    ui-avatars fallbacks.
      frame-src   : YouTube embeds (trailers) + Google Auth iframe.
      Adjust hosting-level headers (Vercel/Netlify/_headers) to match if deploying.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://apis.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com;
      font-src 'self' https://fonts.gstatic.com https://fonts.cdnfonts.com;
      img-src 'self' data: blob: https://cdn.myanimelist.net https://myanimelist.net https://img.youtube.com https://ui-avatars.com https://*.googleusercontent.com;
      frame-src https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com https://anime-sensei-cca0b.firebaseapp.com https://www.google.com https://maps.google.com;
      connect-src 'self'
        https://api.tenrai.org
        https://wzadpcygaqomunypfhlq.supabase.co
        wss://wzadpcygaqomunypfhlq.supabase.co
        https://firebase.googleapis.com
        https://firestore.googleapis.com
        https://identitytoolkit.googleapis.com
        https://securetoken.googleapis.com
        https://*.firebaseio.com
        wss://*.firebaseio.com
        https://www.googleapis.com
        https://www.googletagmanager.com
        https://www.google-analytics.com
        https://www.google.com
        https://firebaseinstallations.googleapis.com;
    " />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
